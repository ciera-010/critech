<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>critech 페이지 관리</title><link rel="stylesheet" href="style.css"></head><body><main class="container admin"><header><a class="logo" href="./">critech<span>✳</span></a><a href="./">사이트 보기 ↗</a></header><h1>페이지 관리</h1><p>문구와 제품을 수정하고, 미리 확인한 뒤 사이트에 반영하세요.</p>
<section class="panel"><h2>GitHub 연결</h2><p class="hint">사이트 저장소의 Contents 읽기·쓰기 권한이 있는 fine-grained 토큰을 입력하세요. 토큰은 저장하지 않으며 GitHub API에만 전송합니다.</p><label for="repo">저장소 (소유자/이름)</label><input id="repo" placeholder="계정/critech" autocomplete="off"><label for="branch">브랜치</label><input id="branch" value="main"><label for="token">GitHub 토큰</label><input id="token" type="password" autocomplete="off"><div class="row"><button class="button" id="connect" type="button">최신 내용 불러오기</button><button class="button" id="disconnect" type="button">연결 해제</button></div></section>
<form id="editor"><section class="panel"><h2>페이지 문구</h2><label for="headline">헤드라인</label><input id="headline" required maxlength="200"><label for="subtitle">서브문구</label><input id="subtitle" required maxlength="200"><label for="navNote">상단 오른쪽 문구</label><input id="navNote" maxlength="200"><label for="sectionTitle">제품 영역 제목</label><input id="sectionTitle" required maxlength="200"></section><section class="panel"><h2>제품 카드</h2><p class="hint">썸네일은 JPG, PNG, WebP 파일(10MB 이하)을 선택하세요. 자동 압축되며 사이트에 반영할 때 저장됩니다. 이미지가 없으면 제품명 커버가 표시됩니다. 공개를 선택한 제품만 사이트에 나타납니다.</p><div id="products"></div><button class="button" id="add" type="button">제품 추가 +</button></section><section class="panel"><h2>카드 미리보기</h2><div class="product-grid" id="preview"></div></section><div class="panel sticky"><div class="row"><button class="button" type="button" id="preview-button">미리보기 갱신</button><button class="button" type="button" id="download">백업 내려받기</button><button class="button primary" id="publish" type="submit">정보 저장하기</button></div><p id="status" role="status" aria-live="polite"></p></div></form><script type="module" src="admin.js?v=text3"></script></main></body></html>
